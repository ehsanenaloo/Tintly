version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    labels:
      - dependencies
    groups:
      actions:
        patterns:
          - "*"
  # The npm packages are dev tools only. Nothing from npm ships in the extension.
  # The repository uses ignore-scripts, so no package runs an install script.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    labels:
      - dependencies
    groups:
      dev-tools:
        patterns:
          - "*"
