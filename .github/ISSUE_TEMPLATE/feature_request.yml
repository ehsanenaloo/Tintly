name: Feature request
description: Suggest an idea or an improvement.
title: "[Feature]: "
labels: ["enhancement", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Tintly makes no network requests of its own and asks for few permissions, so some ideas will not fit. Please describe the problem first.
  - type: textarea
    id: problem
    attributes:
      label: What problem do you want to solve?
      description: Say what you try to do and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried?
      description: Other settings, other engines or other ways to reach the same goal.
  - type: dropdown
    id: needs
    attributes:
      label: Would it need a new permission or a network request?
      options:
        - "No"
        - "Yes"
        - "I don't know"
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find this idea.
          required: true
