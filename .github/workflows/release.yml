name: Release

# Runs when a version tag such as v1.0.0 is pushed. The owner creates the tag.
# It checks that the tag is the manifest version, runs the checks, builds the Chrome and Firefox
# packages, and attaches both zips and their SHA-256 files to a GitHub release. The release notes
# are the section of CHANGELOG.md for that version.
# The build job installs and runs the dev tools with a read-only token. Only the release job can write to the
# repository, and it runs no project code.
# It does NOT publish to any store. Store uploads stay a manual step.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: true

jobs:
  build:
    name: Build and check the packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: The tag is the manifest version
        shell: bash
        run: |
          version="$(node -p "JSON.parse(require('fs').readFileSync('extension/manifest.json','utf8')).version")"
          if [ "${TAG}" != "v${version}" ]; then
            echo "::error::Tag '${TAG}' does not match extension/manifest.json version '${version}'. Expected 'v${version}'."
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - run: npm run check
      - run: npm run lint:firefox

      - name: Build both packages twice and compare
        shell: bash
        run: |
          npm run build
          npm run build:firefox
          sha256sum dist/tintly-${VERSION}-chrome.zip dist/tintly-${VERSION}-firefox.zip > first.txt
          npm run build
          npm run build:firefox
          sha256sum -c first.txt
          mkdir release
          cp dist/tintly-${VERSION}-chrome.zip dist/tintly-${VERSION}-firefox.zip release/
          (cd release && for z in *.zip; do sha256sum "$z" > "$z.sha256"; done)
          cat release/*.sha256 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Check the packages
        shell: bash
        run: |
          for zip in release/tintly-${VERSION}-chrome.zip release/tintly-${VERSION}-firefox.zip; do
            entries="$(unzip -Z1 "${zip}")"
            echo "${entries}" | grep -qx 'manifest.json' || { echo "::error::manifest.json is not at the root of ${zip}"; exit 1; }
            if echo "${entries}" | grep -qE '^(extension/|dist/|tests/|docs/|scripts/|\.github/|node_modules/)'; then
              echo "::error::${zip} holds a project folder"
              exit 1
            fi
            unzip -p "${zip}" manifest.json | node -e "
              const m = JSON.parse(require('fs').readFileSync(0, 'utf8'));
              if (m.version !== process.env.VERSION) { console.error('::error::version ' + m.version + ' differs from ' + process.env.VERSION); process.exit(1); }
            "
          done

      - name: Release notes from CHANGELOG.md
        shell: bash
        run: |
          node - <<'NOTES'
          const fs = require('fs');
          const version = process.env.VERSION;
          const lines = fs.readFileSync('CHANGELOG.md', 'utf8').split(/\r?\n/);
          const start = lines.findIndex((line) => line.startsWith('## [' + version + ']'));
          if (start === -1) {
            if (!version.startsWith('0.')) {
              console.error('::error::CHANGELOG.md has no section for ' + version);
              process.exit(1);
            }
            fs.writeFileSync('notes.md', 'Development build ' + version + '.\n');
          } else {
            let end = lines.findIndex((line, i) => i > start && (line.startsWith('## ') || /^\[[^\]]+\]: /.test(line)));
            if (end === -1) end = lines.length;
            fs.writeFileSync('notes.md', lines.slice(start + 1, end).join('\n').trim() + '\n');
          }
          NOTES
          cat notes.md

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-files
          path: |
            release/
            notes.md
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create the GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-files

      - name: Create the GitHub release
        shell: bash
        run: |
          VERSION="${TAG#v}"
          (cd release && sha256sum -c -- *.sha256)
          test "$(ls release/*.zip | wc -l)" -eq 2
          flags=""
          case "${VERSION}" in 0.*) flags="--prerelease" ;; esac
          gh release create "${TAG}" \
            release/tintly-${VERSION}-chrome.zip release/tintly-${VERSION}-chrome.zip.sha256 \
            release/tintly-${VERSION}-firefox.zip release/tintly-${VERSION}-firefox.zip.sha256 \
            --repo "${REPO}" \
            --title "Tintly ${VERSION}" \
            --notes-file notes.md \
            --verify-tag ${flags}
