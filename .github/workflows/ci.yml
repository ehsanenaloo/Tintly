name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  check:
    name: Validate and unit tests
    if: github.repository == 'ehsanenaloo/Tintly'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run audit
      - run: npm run lint:firefox

  build:
    name: Build both packages
    if: github.repository == 'ehsanenaloo/Tintly'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Compares with the base of the pull request or the commit before the push. The tree equals HEAD here, so a
      # plain check could never fail.
      - name: The version is raised when the extension changed
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "${BASE//0/}" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            BASE="$(git rev-parse --verify --quiet HEAD^ 2>/dev/null)" || BASE=""
            echo "::warning::No usable base commit; comparing with the previous commit."
          fi
          if [ -z "${BASE}" ]; then
            [ "$(git rev-list --count HEAD)" -le 1 ] || { echo "::error::No commit to compare with."; exit 1; }
            echo "First commit: nothing to compare with."
            exit 0
          fi
          npm run version:check -- --base "${BASE}"
      - run: npm run build
      - run: npm run build:firefox
      - name: A second build gives the same bytes and changes no tracked file
        shell: bash
        run: |
          sha256sum dist/*.zip | tee first.txt >> "$GITHUB_STEP_SUMMARY"
          npm run build
          npm run build:firefox
          sha256sum -c first.txt
          test -z "$(git status --porcelain --untracked-files=no)"

  chromium:
    name: Chromium smoke
    if: github.repository == 'ehsanenaloo/Tintly'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run the smoke tests
        shell: bash
        run: |
          node --test --test-concurrency=1 --test-reporter=spec \
            tests/browser/popup-cold.test.mjs \
            tests/browser/worker.test.mjs \
            tests/browser/ondemand.test.mjs \
            tests/browser/security.test.mjs \
            tests/browser/footer-source.test.mjs \
            tests/browser/mixed-build.test.mjs 2>&1 | tee chromium-report.txt
      - name: Put the report in the run summary
        if: failure()
        shell: bash
        run: |
          {
            echo '### Chromium smoke report'
            echo '```'
            test -f chromium-report.txt && tail -c 900000 chromium-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  firefox:
    name: Firefox smoke
    if: github.repository == 'ehsanenaloo/Tintly'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # A runner without Firefox must fail here. With CI set, the Firefox tests fail instead of passing silently.
      - run: firefox --version
      - name: Run the Firefox tests
        shell: bash
        run: npm run test:firefox 2>&1 | tee firefox-report.txt
      - name: Put the report in the run summary
        if: failure()
        shell: bash
        run: |
          {
            echo '### Firefox report'
            echo '```'
            test -f firefox-report.txt && tail -c 900000 firefox-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
