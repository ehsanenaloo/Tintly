name: Sync labels

# Run by hand from the Actions tab, or when labels.yml changes on main.
# It creates or updates the issue labels listed in .github/labels.yml.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/labels.yml
      - scripts/sync-labels.mjs

permissions:
  contents: read
  issues: write

jobs:
  labels:
    name: Create or update labels
    if: github.repository == 'ehsanenaloo/Tintly'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Sync labels
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/sync-labels.mjs
