<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>all: revert</title>
<style>
body { margin: 8px; background: #fff; color: #222; }
.reset { all: revert; display: block; padding: 8px; }
.reset-bg { all: revert; display: block; background: #fff; color: #111; padding: 8px; }
</style>
</head>
<body>
<div id="reset" class="reset">reverted to the browser style</div>
<div id="reset-bg" class="reset-bg">reverted, then colored</div>
</body>
</html>
