<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Site dark: a white section inside four wrappers</title>
<style>
body { margin: 0; background: #ffffff; color: #1d2127; font: 16px/1.5 system-ui, sans-serif; }
.sec { box-sizing: border-box; padding: 24px; height: 400px; }
.a { background: #f4f6fb; }
.b { background: #f1f3f5; }
/* Not covered by the dark rules below. */
.c { background: #ffffff; color: #222; }
@media (prefers-color-scheme: dark) {
  body { background: #101418; color: #e8eaed; }
  .a, .b { background: #161b22; color: #e8eaed; }
}
</style></head>
<body>
<div id="app"><div class="shell"><div class="page"><main class="main">
  <section class="sec a" id="a"><p>Covered by the dark theme.</p></section>
  <section class="sec b" id="b"><p>Covered by the dark theme.</p></section>
  <section class="sec c" id="white"><p id="white-text">A white section the dark theme does not cover.</p></section>
</main></div></div></div>
</body></html>
