<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Night Desk</title>
<style>
body { margin: 0; background: #0f1216; color: #e5e7eb; font: 16px/1.6 system-ui, sans-serif; }
.wrap { max-width: 760px; margin: 0 auto; padding: 32px 24px; }
h1 { color: #fff; margin: 0 0 12px; }
.card { background: #1b2027; border: 1px solid #2d3540; border-radius: 10px; padding: 18px; margin: 16px 0; }
a { color: #7cc4ff; }
.muted { color: #9aa4b2; }
.btn { display: inline-block; background: #3b82f6; color: #fff; padding: 8px 14px; border-radius: 8px; }
code { background: #263040; color: #ffd479; padding: 2px 6px; border-radius: 4px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Night desk</h1>
  <p>This page is already dark. In the paper mode it turns into a page of paper with ink.</p>
  <div class="card"><b>Card title</b><p class="muted">Secondary text sits here. <a href="#">A link</a> and <code>inline code</code>.</p><span class="btn">Continue</span></div>
  <div class="card">Another card with plain light text.</div>
</div>
</body>
</html>
