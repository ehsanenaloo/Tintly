<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Light chromatic sections</title>
<style>
:root { --lav: #d9ddf2; --mauve: #ecd3df; --lav-rgb: 217 221 242; }
body { margin: 0; background: #fff; color: #1a1a1a; font: 16px system-ui; }
section { padding: 24px; min-height: 40px; }
.a { background: linear-gradient(#d9ddf2, #d9ddf2); }
.b { background-image: linear-gradient(90deg, #d9ddf2, #e6d9ef); }
.c { background: rgb(var(--lav-rgb)); }
.d { background: hsl(232 60% 90%); }
.e { background: lavender; }
.f { background: color-mix(in srgb, #8c9ae0 25%, white); }
.g { background: rgba(120, 140, 230, .22); }
.h { background: var(--mauve); }
.i { background: oklch(0.9 0.04 330); }
.j { background: var(--missing, #ecd3df); }
.k { background-color: #ecd3df; background-image: none; }
.l { background: #ecd3df linear-gradient(transparent, transparent); }
</style></head>
<body>
<section class="a" id="a">a</section><section class="b" id="b">b</section><section class="c" id="c">c</section><section class="d" id="d">d</section>
<section class="e" id="e">e</section><section class="f" id="f">f</section><section class="g" id="g">g</section><section class="h" id="h">h</section>
<section class="i" id="i">i</section><section class="j" id="j">j</section><section class="k" id="k">k</section><section class="l" id="l">l</section>
<section style="background:#d9ddf2" id="m">m</section><section bgcolor="#d9ddf2" id="n">n</section>
</body></html>
