<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Short page</title>
<style>
  body { margin: 8px; font: 16px system-ui; color: #222; }
  .paint-body { background: #fff; }
  .paint-root { background: #fff; }
  .paint-gray { background: #f2f2f2; }
</style>
<script>
  // The hash picks which element carries the page color: none, body, root, or a light gray on the body.
  const h = location.hash.slice(1);
  document.addEventListener('DOMContentLoaded', () => {
    if (h === 'body') document.body.classList.add('paint-body');
    if (h === 'gray') document.body.classList.add('paint-gray');
  });
  if (h === 'root') document.documentElement.classList.add('paint-root');
</script>
</head>
<body>
<p>A short page. The area under the white box is the canvas.</p>
<div id="box" style="background:#fff;height:48px"></div>
</body>
</html>
