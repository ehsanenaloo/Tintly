<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Site dark: media rules and a white section</title>
<style>
body { margin: 0; background: #ffffff; color: #1d2127; font: 16px/1.5 system-ui, sans-serif; }
section, footer { box-sizing: border-box; padding: 24px; }
#hero { height: 500px; background: #f4f6fb; }
#features { height: 500px; }
.card { background: #f1f3f5; color: #1d2127; padding: 12px; margin: 12px 0; border: 1px solid #c9ced4; }
a { color: #0b57d0; }
/* Not covered by the dark rules below: a hard coded white gradient with the light text of the dark theme on it. */
#promo { height: 700px; background: linear-gradient(180deg,#fff 80%,#fbfbff); }
#promo h2 { border-bottom: 1px solid #e3e3e3; }
footer { height: 300px; background: #eceff3; }
@media (prefers-color-scheme: dark) {
  body { background: #101418; color: #e8eaed; }
  #hero { background: #161b22; }
  .card { background: #1b2128; color: #e8eaed; border-color: #3b4450; }
  a { color: #8ab4f8; }
  footer { background: #0d1117; }
}
</style></head>
<body>
<section id="hero"><h1>Landing</h1><p>Top of the page.</p></section>
<section id="features"><div class="card" id="card"><p>A card the dark theme covers.</p><a id="link" href="#x">link</a></div></section>
<section id="promo"><h2>Promo</h2><p id="promo-text">Light text from the dark theme on a white gradient.</p></section>
<section id="inline" style="height:300px;background:#fafafa;color:#222"><p id="inline-text">An inline white section.</p></section>
<div id="host"></div>
<footer id="footer"><p>Footer</p></footer>
<script>
const root = document.getElementById('host').attachShadow({ mode: 'open' });
root.innerHTML = '<style>.w{background:#ffffff;color:#111;height:300px;padding:24px;box-sizing:border-box}</style><div class="w" id="shadow-box">A white box in a shadow root.</div>';
</script>
</body></html>
