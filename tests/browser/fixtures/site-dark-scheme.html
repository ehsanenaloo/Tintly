<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Site dark: color-scheme and light-dark()</title>
<style>
:root { color-scheme: light dark; }
body { margin: 0; background: light-dark(#ffffff, #0e1116); color: light-dark(#1d2127, #e6e8eb); font: 16px/1.5 system-ui, sans-serif; }
.card { background: light-dark(#f1f3f5, #1a2028); color: light-dark(#1d2127, #e6e8eb); padding: 12px; margin: 12px; }
</style></head>
<body><main><div class="card" id="card"><p id="text">Own dark theme by light-dark().</p></div></main></body></html>
