<!doctype html><html><head><meta charset="utf-8"><title>Markup colors</title><style>body{background:#fff;color:#222;font:16px system-ui}</style></head><body>
<p id="imp" style="color:#000 !important">Black with important</p>
<p id="imp-fill" style="color:#000 !important;-webkit-text-fill-color:#111">Own fill color</p>
<p id="plain" style="color:#000">Black plain</p>
<table><tr>
<td id="l-ffff" bgcolor="ffff">pad four digits</td>
<td id="l-name" bgcolor="WhiteSmoke">name with case</td>
<td id="l-short" bgcolor="#fff">short hex</td>
<td id="l-bad" bgcolor="chucknorris">junk</td>
<td id="r-ffff" bgcolor="#ffff00">same as ffff</td>
<td id="r-name" bgcolor="#f5f5f5">same as the name</td>
<td id="r-bad" bgcolor="#c00000">same as the junk</td>
<td id="l-none" bgcolor="transparent">transparent</td>
</tr></table>
<p><font id="f-short" color="ff0">short without hash</font> <font id="f-dark" color="#333">dark</font> <font id="f-bad" color="rgb(10,10,10)">function text</font></p>
</body></html>
