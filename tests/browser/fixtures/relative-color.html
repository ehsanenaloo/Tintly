<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Relative colors</title>
<style>
body { margin: 8px; background: #fff; color: #222; }
#rgb { background: rgb(from #ffffff r g b); color: rgb(from #222222 r g b); padding: 8px; }
#okl { background: oklch(from white l c h); color: oklch(from black l c h); padding: 8px; }
#alpha { background: rgb(from #fafafa r g b / 0.9); color: #111; padding: 8px; }
#mix { border: 3px solid rgb(from #dddddd r g b); padding: 8px; }
#grad { background: linear-gradient(rgb(from #ffffff r g b), rgb(from #f0f0f0 r g b)); color: #111; padding: 8px; }
#plain { background: #ffffff; color: #222; padding: 8px; }
</style>
</head>
<body>
<p id="rgb">rgb relative</p>
<p id="okl">oklch relative</p>
<p id="alpha">relative with alpha</p>
<p id="mix">relative border</p>
<p id="grad">relative gradient</p>
<p id="plain">plain</p>
</body>
</html>
