<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Focus ring made of a shadow</title>
<style>
body{background:#fff;color:#111;font:16px system-ui;margin:16px}
button{padding:8px 14px;border:1px solid #888;background:#eee;outline:none}
button.ring:focus-visible{box-shadow:0 0 0 3px #1a73e8}
.card{box-shadow:0 4px 12px rgba(0,0,0,.3);padding:12px;margin-top:12px;width:200px}
</style></head>
<body>
<button class="ring" id="b">Save</button>
<div class="card" id="card">A card with a drop shadow</div>
</body></html>
