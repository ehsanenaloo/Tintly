<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Faint veils</title>
<style>
body { margin: 0; background: #f4f5f7; color: #111; font: 14px sans-serif; }
.lead { height: 40px; padding: 8px 24px; }
.hero { padding: 24px; background: #0b1020; color: #e8eaf0; }
.glass { width: 300px; height: 80px; margin: 10px 0; background: rgba(255, 255, 255, 0.1); border: 2px solid rgba(255, 255, 255, 0.2); }
.plain { width: 300px; height: 80px; margin: 10px 0; background: transparent; border: 2px solid transparent; }
.panel { width: 300px; height: 80px; margin: 10px 0; background: rgba(255, 255, 255, 0.9); color: #111; }
</style>
</head>
<body>
<div class="lead">A light page with a dark section</div>
<div class="hero">
  <div class="plain" id="plain">no veil</div>
  <div class="glass" id="glass">glass card</div>
  <div class="panel" id="panel">frosted panel</div>
</div>
</body>
</html>
