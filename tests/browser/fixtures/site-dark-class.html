<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Site dark: class rules</title>
<style>
body { margin: 0; background: #ffffff; color: #1d2127; font: 16px/1.5 system-ui, sans-serif; }
.card { background: #f1f3f5; color: #1d2127; padding: 12px; margin: 12px; border: 1px solid #c9ced4; }
a { color: #0b57d0; }
.dark body, html.dark { background: #101418; color: #e8eaed; }
.dark .card { background: #1b2128; color: #e8eaed; border-color: #3b4450; }
.dark a { color: #8ab4f8; }
.dark { --accent: #8ab4f8; }
.light .card { outline: 2px solid #ff00ff; }
.card.dark { background: #ff0000; }
</style></head>
<body><main><div class="card" id="card"><p id="text">Own dark theme by a class on the root.</p><a id="link" href="#x">link</a></div></main></body></html>
