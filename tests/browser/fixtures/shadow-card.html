<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Shadows</title>
<style>
body { margin: 0; padding: 60px 0; background: #ffffff; color: #1d2127; font: 16px/1.5 system-ui, sans-serif; }
.card { box-sizing: border-box; width: 300px; height: 120px; margin: 0 auto 80px; background: #ffffff; border-radius: 8px; padding: 12px; }
#plain { box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35); }
#glow { box-shadow: 0 0 24px rgba(26, 115, 232, 0.8); }
#drop { filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.5)); }
#var { --edge: rgba(0, 0, 0, 0.4); box-shadow: 0 8px 24px var(--edge); }
</style></head>
<body>
<div class="card" id="plain">plain</div>
<div class="card" id="glow">glow</div>
<div class="card" id="drop">drop</div>
<div class="card" id="var">var</div>
</body></html>
