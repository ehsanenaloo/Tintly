<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Service status</title>
<style>
body { margin: 0; font: 16px/1.5 system-ui, "Segoe UI", sans-serif; background: #f5f6f8; color: #1d2330; }
header { background: #ffffff; border-bottom: 1px solid #dde1e8; padding: 14px 32px; display: flex; justify-content: space-between; align-items: center; }
header b { font-size: 20px; }
header span { color: #5a6475; }
main { max-width: 1040px; margin: 24px auto; padding: 0 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.card { background: #ffffff; border: 1px solid #dde1e8; border-radius: 12px; padding: 18px 20px; }
.card h2 { margin: 0 0 12px; font-size: 17px; }
.wide { grid-column: 1 / -1; }
table { width: 100%; border-collapse: collapse; }
td, th { text-align: left; padding: 9px 6px; border-bottom: 1px solid #edf0f4; }
.dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 8px; vertical-align: -1px; }
.ok { background: #6b8e23; }
.warn { background: #d4a017; }
.bad { background: #cc3333; }
.pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 14px; color: #ffffff; }
.pill.ok { background: #5b7f1a; }
.pill.bad { background: #c62828; }
.pill.warn { background: #b8860b; }
.legend { display: flex; gap: 18px; margin-top: 10px; font-size: 14px; color: #3a4354; }
.legend i { display: inline-block; width: 14px; height: 14px; border-radius: 3px; margin-right: 6px; vertical-align: -2px; }
svg { width: 100%; height: 200px; }
</style>
</head>
<body>
<header><b>Status board</b><span>Updated a minute ago</span></header>
<main>
  <section class="card">
    <h2>Services</h2>
    <table>
      <tr><td><span class="dot ok"></span>Website</td><td><span class="pill ok">Running</span></td></tr>
      <tr><td><span class="dot bad"></span>Payments</td><td><span class="pill bad">Failed</span></td></tr>
      <tr><td><span class="dot ok"></span>Search</td><td><span class="pill ok">Running</span></td></tr>
      <tr><td><span class="dot warn"></span>Email</td><td><span class="pill warn">Slow</span></td></tr>
      <tr><td><span class="dot bad"></span>Backups</td><td><span class="pill bad">Failed</span></td></tr>
    </table>
  </section>
  <section class="card">
    <h2>Tests this week</h2>
    <table>
      <tr><th>Suite</th><th>Result</th></tr>
      <tr><td>Login</td><td style="color:#2e7d32">Passed</td></tr>
      <tr><td>Checkout</td><td style="color:#c62828">Failed</td></tr>
      <tr><td>Reports</td><td style="color:#2e7d32">Passed</td></tr>
      <tr><td>Export</td><td style="color:#c62828">Failed</td></tr>
      <tr><td>Search</td><td style="color:#2e7d32">Passed</td></tr>
    </table>
  </section>
  <section class="card wide">
    <h2>Visits, orders and refunds</h2>
    <svg viewBox="0 0 800 200" role="img" aria-label="Line chart">
      <g stroke="#dde1e8"><line x1="0" y1="40" x2="800" y2="40"/><line x1="0" y1="100" x2="800" y2="100"/><line x1="0" y1="160" x2="800" y2="160"/></g>
      <polyline fill="none" stroke="#cc3333" stroke-width="4" points="0,150 100,120 200,130 300,90 400,100 500,60 600,70 700,40 800,50"/>
      <polyline fill="none" stroke="#6b8e23" stroke-width="4" points="0,160 100,140 200,150 300,120 400,125 500,95 600,100 700,80 800,85"/>
      <polyline fill="none" stroke="#1e88e5" stroke-width="4" points="0,180 100,175 200,170 300,165 400,168 500,150 600,155 700,140 800,145"/>
    </svg>
    <div class="legend"><span><i style="background:#cc3333"></i>Refunds</span><span><i style="background:#6b8e23"></i>Orders</span><span><i style="background:#1e88e5"></i>Visits</span></div>
  </section>
</main>
</body>
</html>
