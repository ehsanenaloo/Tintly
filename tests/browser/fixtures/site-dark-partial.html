<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Site dark: a dark rule that changes nothing visible</title>
<style>
body { margin: 0; background: #ffffff; color: #20242a; font: 16px/1.5 system-ui, sans-serif; }
.card { background: #f1f3f5; color: #20242a; padding: 12px; margin: 12px; }
@media (prefers-color-scheme: dark) {
  .footer-note { color: #ccc; }
}
</style></head>
<body><main><div class="card" id="card"><p id="text">Only a footer has a dark rule.</p></div><p class="footer-note">note</p></main></body></html>
