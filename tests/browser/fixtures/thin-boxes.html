<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lines and dots drawn with a background color</title>
<style>
body { margin: 12px; background: #fff; color: #222; }
.bar { display: block; width: 24px; height: 3px; background: #000; margin: 4px 0; }
.rule { height: 1px; background: #e5e5e5; margin: 8px 0; }
.dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #000; }
.tall { display: inline-block; width: 2px; height: 16px; background: #000; }
.card { width: 200px; height: 100px; background: #fff; border: 1px solid #ccc; }
.plain { width: 24px; height: 24px; background: #000; }
</style>
</head>
<body>
<span id="bar1" class="bar"></span><span id="bar2" class="bar"></span>
<div id="rule" class="rule"></div>
<span id="dot" class="dot"></span> <span id="tall" class="tall"></span>
<div id="card" class="card"></div>
<div id="plain" class="plain"></div>
</body>
</html>
