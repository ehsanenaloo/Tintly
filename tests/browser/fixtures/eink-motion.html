<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Motion</title>
<style>
html { scroll-behavior: smooth; }
body { margin: 0; background: #fff; color: #222; font: 16px/1.5 system-ui, sans-serif; padding: 24px; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes appear { from { opacity: 0; } to { opacity: 1; } }
#spinner { width: 40px; height: 40px; border: 4px solid #999; border-top-color: #222; border-radius: 50%; animation: spin 2s linear infinite; }
#fade { opacity: 0; animation: appear 3s ease-in forwards; padding: 8px; }
#slide { width: 100px; height: 40px; background: #ddd; transition: width 4s linear; }
#slide:hover, #slide.wide { width: 300px; }
#card { margin-top: 16px; padding: 16px; width: 240px; background: #fff; border: 1px solid #ddd; box-shadow: 0 8px 20px rgba(0,0,0,.35); text-shadow: 2px 2px 4px rgba(0,0,0,.4); }
#tall { height: 1500px; }
#probe { margin-top: 8px; }
</style>
</head>
<body>
<div id="spinner"></div>
<div id="fade">Faded in text</div>
<div id="slide"></div>
<div id="card">A card with shadows</div>
<p id="probe"></p>
<div id="tall">tall</div>
<script>
  const reduce = matchMedia('(prefers-reduced-motion: reduce)');
  const none = matchMedia('(prefers-reduced-motion: no-preference)');
  const show = () => { document.getElementById('probe').textContent = 'reduce=' + reduce.matches + ' nopref=' + none.matches; document.documentElement.dataset.reduce = String(reduce.matches); };
  reduce.addEventListener('change', show);
  show();
</script>
</body>
</html>
