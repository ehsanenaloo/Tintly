<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Late link</title></head>
<body>
<div id="box">A box that a late stylesheet colors</div>
<script>
  setTimeout(() => {
    const link = document.createElement('link');
    document.body.appendChild(link);
    link.rel = 'stylesheet';
    link.href = '/late-link.css';
  }, 600);
</script>
</body></html>
