<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Site dark: media rules, transitions everywhere</title>
<style>
* { transition: all .4s; }
body { margin: 0; background: #ffffff; color: #1d2127; font: 16px/1.5 system-ui, sans-serif; }
.card { display: inline-block; background: #f1f3f5; color: #1d2127; padding: 6px; margin: 4px; border: 1px solid #c9ced4; }
a { color: #0b57d0; }
@media (prefers-color-scheme: dark) {
  body { background: #101418; color: #e8eaed; }
  .card { background: #1b2128; color: #e8eaed; border-color: #3b4450; }
  a { color: #8ab4f8; }
}
</style></head>
<body><main id="list"></main>
<script>
  // Every element has `transition: all`, the way a utility class sheet often gives it.
  const html = [];
  for (let i = 0; i < 800; i++) html.push(`<div class="card"><a href="#x">Item ${i}</a> <span>tag</span></div>`);
  document.getElementById('list').innerHTML = html.join('');
</script>
</body></html>
