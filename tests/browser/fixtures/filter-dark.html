<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dark page fixture</title>
<style>
  html, body { margin: 0; }
  body { background: #121212; color: #eeeeee; height: 400px; }
  .box { position: absolute; top: 100px; width: 60px; height: 40px; }
  #a { left: 100px; background: #3366cc; }
  #b { left: 180px; background: #cc3333; }
  #c { left: 260px; background: #33aa55; }
  #d { left: 340px; background: #2a2a2a; }
</style>
</head>
<body><div class="box" id="a"></div><div class="box" id="b"></div><div class="box" id="c"></div><div class="box" id="d"></div></body>
</html>
