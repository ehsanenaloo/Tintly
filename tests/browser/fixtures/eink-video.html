<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Video page</title>
<style>
  body { margin: 0; font: 16px system-ui; background: #fff; color: #111; }
  header { padding: 12px 16px; background: #f1f1f1; }
  main { padding: 16px; max-width: 900px; }
  #player { position: relative; width: 640px; height: 360px; background: #000; }
  #player video { width: 100%; height: 100%; display: block; background: #222; }
  #player.wide { position: fixed; inset: 0; width: auto; height: auto; z-index: 10; }
  #controls { position: absolute; left: 0; right: 0; bottom: 0; height: 40px; background: rgba(0,0,0,.5); color: #fff; padding: 8px; }
  .card { display: inline-block; width: 200px; margin: 8px; padding: 8px; background: #eef; border: 1px solid #99c; }
  .card:hover { background: #dde; }
  #controls { transition: opacity .2s; }
  #player.idle #controls { opacity: 0; }
  #bar { transition: background-color .3s; }
</style>
</head>
<body>
<header><a href="#">Home</a> <a href="#">Videos</a></header>
<main>
  <div id="player"><video id="v" muted playsinline></video><div id="controls"><div id="bar" style="height:4px;width:0;background:#f00"></div><span id="time">00:00 / 03:00</span><button id="btn" class="ctl">Play</button></div></div>
  <h1>Title of the video</h1>
  <p>Some text under the video.</p>
  <div id="cards"></div>
</main>
<script>
  const cv = document.createElement('canvas');
  cv.width = 640; cv.height = 360;
  const ctx = cv.getContext('2d');
  let t = 0;
  function draw() {
    t++;
    for (let i = 0; i < 6; i++) {
      ctx.fillStyle = `hsl(${(t * 3 + i * 60) % 360} 80% 55%)`;
      ctx.fillRect(((t * 7 + i * 100) % 700) - 60, i * 60, 120, 60);
    }
    requestAnimationFrame(draw);
  }
  draw();
  const v = document.getElementById('v');
  v.srcObject = cv.captureStream(30);
  v.play().catch(() => {});
  for (let i = 0; i < 40; i++) {
    const d = document.createElement('div');
    d.className = 'card';
    d.textContent = 'Related video ' + i;
    document.getElementById('cards').append(d);
  }
  // What a player does while a video plays: the bar, the time and a class move all the time.
  const bar = document.getElementById('bar'), time = document.getElementById('time'), btn = document.getElementById('btn');
  let n = 0;
  (function tickUi() { n++; bar.style.width = (n % 600) + 'px'; if (n % 15 === 0) { time.textContent = '00:' + String(n % 60).padStart(2, '0') + ' / 03:00'; btn.classList.toggle('on'); } requestAnimationFrame(tickUi); })();
  // The mouse over the player shows the controls and hides them again after a short idle time, as a player does.
  const player = document.getElementById('player');
  let idle = 0;
  player.addEventListener('mousemove', () => { player.classList.remove('idle'); clearTimeout(idle); idle = setTimeout(() => player.classList.add('idle'), 2500); });
  // The wide player: same box rules as a maximized player.
  window.setWide = (on) => document.getElementById('player').classList.toggle('wide', on);
</script>
</body>
</html>
