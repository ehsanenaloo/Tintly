<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>A button on a hero picture</title>
<style>
body{margin:0;background:#fff;color:#202124;font:16px system-ui}
#hero{position:relative;height:320px;background:url(/img/scene.svg) center/cover;color:#fff;padding:24px}
#hero h1{margin:0 0 16px;font-size:34px;color:#ffffff}
.btn{display:inline-block;padding:10px 18px;border-radius:6px;text-decoration:none;background:#0053a0;color:#ffffff}
.pill{display:inline-block;padding:10px 18px;background:#188038;color:#fff}
</style></head>
<body>
<div id="hero">
  <h1 id="title">Title straight on the picture</h1>
  <a class="btn" id="btn" href="#a">Go to homepage</a>
  <span class="pill" id="pill">In stock</span>
</div>
<p>After the hero</p>
</body></html>
